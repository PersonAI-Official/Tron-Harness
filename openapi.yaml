openapi: 3.1.0
info:
  title: Tron API
  description: Tron backend HTTP API. Coverage is added progressively by bounded context.
  license:
    name: AGPL-3.0-only
  version: 1.1.0
paths:
  /api/v1/health:
    get:
      tags:
      - System
      operationId: health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_HealthData'
  /api/v1/observability/browser-spans:
    post:
      tags:
      - Observability
      operationId: record_browser_span
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserSpansRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_EmptyData'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_EmptyData'
  /api/v1/observability/collector/export-config:
    post:
      tags:
      - Observability
      operationId: get_export_config
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_CollectorConnection'
  /api/v1/observability/dashboard:
    get:
      tags:
      - Observability
      operationId: get_dashboard
      parameters:
      - name: workspaceCode
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ObservabilityDashboardVo'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_EmptyData'
  /api/v1/observability/logs/query:
    post:
      tags:
      - Observability
      operationId: query_logs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryLogsRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ApplicationLogPage'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_EmptyData'
  /api/v1/observability/metric-points/query:
    post:
      tags:
      - Observability
      operationId: query_metric_points
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryMetricPointsRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_MetricPage'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_EmptyData'
  /api/v1/observability/metrics:
    get:
      tags:
      - Observability
      operationId: get_metrics
      parameters:
      - name: workspaceCode
        in: query
        required: false
        schema:
          type: string
      - name: sessionCode
        in: query
        required: false
        schema:
          type: string
      - name: traceId
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_TraceMetrics'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_EmptyData'
  /api/v1/observability/runtime:
    get:
      tags:
      - Observability
      operationId: get_runtime
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_RuntimeMetrics'
  /api/v1/observability/traces/query:
    post:
      tags:
      - Observability
      operationId: query_traces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryTracesRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_TracePage'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_EmptyData'
  /api/v1/observability/traces/{trace_id}:
    get:
      tags:
      - Observability
      operationId: get_trace
      parameters:
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
      - name: workspaceCode
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_TraceDetail'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_EmptyData'
  /api/v1/profiles/active/preferences:
    patch:
      tags:
      - Profiles
      operationId: update_preferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
        required: true
      responses:
        '200':
          description: User time zone saved
        '400':
          description: Invalid IANA time zone
  /api/v1/readiness:
    get:
      tags:
      - System
      operationId: readiness
      responses:
        '200':
          description: All dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ReadinessData'
        '503':
          description: A dependency is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ReadinessData'
components:
  schemas:
    ApiResponse_ApplicationLogPage:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
        data:
          type: object
          required:
          - date
          - timeZone
          - current
          - size
          - total
          - records
          properties:
            current:
              type: integer
              minimum: 0
            date:
              type: string
            records:
              type: array
              items:
                $ref: '#/components/schemas/ApplicationLog'
            size:
              type: integer
              minimum: 0
            timeZone:
              type: string
            total:
              type: integer
              minimum: 0
        message:
          type: string
    ApiResponse_CollectorConnection:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
        data:
          type: object
          required:
          - endpoint
          - authorization
          - traceRetentionDays
          - metricRetentionDays
          - maxTraceRecords
          properties:
            authorization:
              type: string
            endpoint:
              type: string
            maxTraceRecords:
              type: integer
              minimum: 0
            metricRetentionDays:
              type: integer
              format: int64
            traceRetentionDays:
              type: integer
              format: int64
        message:
          type: string
    ApiResponse_EmptyData:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
        data:
          type: object
        message:
          type: string
    ApiResponse_HealthData:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
        data:
          type: object
          required:
          - status
          - service
          - version
          properties:
            service:
              type: string
            status:
              type: string
            version:
              type: string
        message:
          type: string
    ApiResponse_MetricPage:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
        data:
          type: object
          required:
          - current
          - size
          - total
          - records
          properties:
            current:
              type: integer
              minimum: 0
            records:
              type: array
              items:
                $ref: '#/components/schemas/MetricPoint'
            size:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
        message:
          type: string
    ApiResponse_ObservabilityDashboardVo:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
        data:
          allOf:
          - $ref: '#/components/schemas/ObservabilityDashboard'
          - type: object
            required:
            - diskUsage
            properties:
              diskUsage:
                $ref: '#/components/schemas/DiskUsageSnapshot'
        message:
          type: string
    ApiResponse_ReadinessData:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
        data:
          type: object
          required:
          - status
          - service
          - version
          - components
          properties:
            components:
              $ref: '#/components/schemas/ReadinessComponents'
            service:
              type: string
            status:
              type: string
            version:
              type: string
        message:
          type: string
    ApiResponse_RuntimeMetrics:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
        data:
          type: object
          required:
          - metricPointCount
          properties:
            cpuPercent:
              type:
              - number
              - 'null'
              format: double
            memoryBytes:
              type:
              - integer
              - 'null'
              format: int64
              minimum: 0
            metricPointCount:
              type: integer
              minimum: 0
            sampledAt:
              type:
              - integer
              - 'null'
              format: int64
        message:
          type: string
    ApiResponse_TraceDetail:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
        data:
          type: object
          required:
          - trace
          - spans
          properties:
            spans:
              type: array
              items:
                $ref: '#/components/schemas/TraceSpan'
            trace:
              $ref: '#/components/schemas/TraceSummary'
        message:
          type: string
    ApiResponse_TraceMetrics:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
        data:
          type: object
          required:
          - traceCount
          - failedTraceCount
          - inputTokens
          - outputTokens
          - averageDurationMs
          - p95DurationMs
          properties:
            averageDurationMs:
              type: number
              format: double
            failedTraceCount:
              type: integer
              minimum: 0
            inputTokens:
              type: integer
              format: int64
              minimum: 0
            outputTokens:
              type: integer
              format: int64
              minimum: 0
            p95DurationMs:
              type: number
              format: double
            traceCount:
              type: integer
              minimum: 0
        message:
          type: string
    ApiResponse_TracePage:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
        data:
          type: object
          required:
          - agentOptions
          - current
          - size
          - total
          - records
          properties:
            agentOptions:
              type: array
              items:
                $ref: '#/components/schemas/TraceAgentOption'
            current:
              type: integer
              minimum: 0
            records:
              type: array
              items:
                $ref: '#/components/schemas/TraceSummary'
            size:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
        message:
          type: string
    ApplicationLog:
      type: object
      required:
      - logId
      - timestamp
      - level
      - target
      - message
      - attributes
      properties:
        attributes:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        level:
          type: string
        logId:
          type: string
        message:
          type: string
        spanId:
          type:
          - string
          - 'null'
        target:
          type: string
        timestamp:
          type: integer
          format: int64
        traceId:
          type:
          - string
          - 'null'
    ApplicationLogPage:
      type: object
      required:
      - date
      - timeZone
      - current
      - size
      - total
      - records
      properties:
        current:
          type: integer
          minimum: 0
        date:
          type: string
        records:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationLog'
        size:
          type: integer
          minimum: 0
        timeZone:
          type: string
        total:
          type: integer
          minimum: 0
    BrowserRequestFailure:
      type: string
      enum:
      - Cancelled
      - Timeout
      - Network
      - Http
    BrowserSpanKind:
      type: string
      enum:
      - Page
      - Resource
      - Request
    BrowserSpanRequest:
      type: object
      description: Record completed application API requests without credentials, query strings or polling noise.
      required:
      - kind
      - traceId
      - spanId
      - startedAt
      - endedAt
      - method
      - path
      - status
      properties:
        endedAt:
          type: integer
          format: int64
        failure:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/BrowserRequestFailure'
        kind:
          $ref: '#/components/schemas/BrowserSpanKind'
        method:
          type: string
        parentSpanId:
          type:
          - string
          - 'null'
        path:
          type: string
        phase:
          type:
          - string
          - 'null'
        spanId:
          type: string
        startedAt:
          type: integer
          format: int64
        status:
          type: integer
          format: int32
          minimum: 0
        traceId:
          type: string
      additionalProperties: false
    BrowserSpansRequest:
      type: object
      required:
      - spans
      properties:
        spans:
          type: array
          items:
            $ref: '#/components/schemas/BrowserSpanRequest'
      additionalProperties: false
    CollectorConnection:
      type: object
      required:
      - endpoint
      - authorization
      - traceRetentionDays
      - metricRetentionDays
      - maxTraceRecords
      properties:
        authorization:
          type: string
        endpoint:
          type: string
        maxTraceRecords:
          type: integer
          minimum: 0
        metricRetentionDays:
          type: integer
          format: int64
        traceRetentionDays:
          type: integer
          format: int64
    DiskUsageMeasurement:
      type: string
      enum:
      - Allocated
      - Logical
    DiskUsageSnapshot:
      type: object
      required:
      - paths
      - measurement
      properties:
        bytes:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        measurement:
          $ref: '#/components/schemas/DiskUsageMeasurement'
        paths:
          type: array
          items:
            type: string
        sampledAt:
          type:
          - integer
          - 'null'
          format: int64
    EmptyData:
      type: object
    HealthData:
      type: object
      required:
      - status
      - service
      - version
      properties:
        service:
          type: string
        status:
          type: string
        version:
          type: string
    MetricPage:
      type: object
      required:
      - current
      - size
      - total
      - records
      properties:
        current:
          type: integer
          minimum: 0
        records:
          type: array
          items:
            $ref: '#/components/schemas/MetricPoint'
        size:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    MetricPoint:
      type: object
      required:
      - pointId
      - name
      - description
      - unit
      - kind
      - temporality
      - monotonic
      - timestamp
      - resource
      - scope
      - data
      properties:
        data: {}
        description:
          type: string
        kind:
          type: string
        monotonic:
          type: boolean
        name:
          type: string
        pointId:
          type: string
        resource:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        scope:
          type: string
        temporality:
          type: integer
          format: int32
        timestamp:
          type: integer
          format: int64
        unit:
          type: string
    ObservabilityDashboard:
      type: object
      required:
      - sampledAt
      - traceCount
      - failedTraceCount
      - runningTraceCount
      - inputTokens
      - outputTokens
      - averageDurationMs
      - p95DurationMs
      - recentRequests
      - metricPointCount
      - processes
      properties:
        averageDurationMs:
          type: number
          format: double
        cpuPercent:
          type:
          - number
          - 'null'
          format: double
        failedTraceCount:
          type: integer
          minimum: 0
        inputTokens:
          type: integer
          format: int64
          minimum: 0
        memoryBytes:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        metricPointCount:
          type: integer
          minimum: 0
        outputTokens:
          type: integer
          format: int64
          minimum: 0
        p95DurationMs:
          type: number
          format: double
        processes:
          type: array
          items:
            $ref: '#/components/schemas/ServiceProcess'
        recentRequests:
          type: array
          items:
            $ref: '#/components/schemas/RequestBucket'
        resourceSampledAt:
          type:
          - integer
          - 'null'
          format: int64
        runningTraceCount:
          type: integer
          minimum: 0
        sampledAt:
          type: integer
          format: int64
        traceCount:
          type: integer
          minimum: 0
    ObservabilityDashboardVo:
      allOf:
      - $ref: '#/components/schemas/ObservabilityDashboard'
      - type: object
        required:
        - diskUsage
        properties:
          diskUsage:
            $ref: '#/components/schemas/DiskUsageSnapshot'
    QueryLogsRequest:
      type: object
      required:
      - current
      - size
      properties:
        afterLogId:
          type:
          - string
          - 'null'
        beforeLogId:
          type:
          - string
          - 'null'
        current:
          type: integer
          minimum: 0
        date:
          type:
          - string
          - 'null'
        keyword:
          type:
          - string
          - 'null'
        level:
          type:
          - string
          - 'null'
        size:
          type: integer
          minimum: 0
        spanId:
          type:
          - string
          - 'null'
        timeZone:
          type:
          - string
          - 'null'
        traceId:
          type:
          - string
          - 'null'
        workspaceCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    QueryMetricPointsRequest:
      type: object
      required:
      - current
      - size
      properties:
        current:
          type: integer
          minimum: 0
        name:
          type:
          - string
          - 'null'
        size:
          type: integer
          minimum: 0
        workspaceCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    QueryTracesRequest:
      type: object
      required:
      - current
      - size
      properties:
        agentCode:
          type:
          - string
          - 'null'
        category:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TraceCategory'
        current:
          type: integer
          minimum: 0
        keyword:
          type:
          - string
          - 'null'
        keywordAliases:
          type: array
          items:
            type: string
        sessionCode:
          type:
          - string
          - 'null'
        size:
          type: integer
          minimum: 0
        sortBy:
          $ref: '#/components/schemas/TraceSortField'
        sortDirection:
          $ref: '#/components/schemas/TraceSortDirection'
        sorts:
          type: array
          items:
            $ref: '#/components/schemas/TraceSort'
        spanId:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
        traceId:
          type:
          - string
          - 'null'
        workspaceCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    ReadinessComponents:
      type: object
      required:
      - storage
      - graph
      - rag
      properties:
        graph:
          type: string
        rag:
          type: string
        storage:
          type: string
    ReadinessData:
      type: object
      required:
      - status
      - service
      - version
      - components
      properties:
        components:
          $ref: '#/components/schemas/ReadinessComponents'
        service:
          type: string
        status:
          type: string
        version:
          type: string
    RequestBucket:
      type: object
      required:
      - startedAt
      - requests
      - errors
      properties:
        errors:
          type: integer
          minimum: 0
        requests:
          type: integer
          minimum: 0
        startedAt:
          type: integer
          format: int64
    RuntimeMetrics:
      type: object
      required:
      - metricPointCount
      properties:
        cpuPercent:
          type:
          - number
          - 'null'
          format: double
        memoryBytes:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        metricPointCount:
          type: integer
          minimum: 0
        sampledAt:
          type:
          - integer
          - 'null'
          format: int64
    ServiceProcess:
      type: object
      required:
      - pid
      - name
      - memoryBytes
      - startedAt
      properties:
        memoryBytes:
          type: integer
          format: int64
          minimum: 0
        name:
          type: string
        parentPid:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        pid:
          type: integer
          format: int32
          minimum: 0
        startedAt:
          type: integer
          format: int64
    SpanEvent:
      type: object
      required:
      - name
      - timestamp
      - attributes
      properties:
        attributes:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        name:
          type: string
        timestamp:
          type: integer
          format: int64
    SpanLink:
      type: object
      required:
      - traceId
      - spanId
      properties:
        spanId:
          type: string
        traceId:
          type: string
    TraceAgentOption:
      type: object
      required:
      - code
      - name
      properties:
        code:
          type: string
        name:
          type: string
    TraceCategory:
      type: string
      enum:
      - Page
      - Agent
    TraceDetail:
      type: object
      required:
      - trace
      - spans
      properties:
        spans:
          type: array
          items:
            $ref: '#/components/schemas/TraceSpan'
        trace:
          $ref: '#/components/schemas/TraceSummary'
    TraceMetrics:
      type: object
      required:
      - traceCount
      - failedTraceCount
      - inputTokens
      - outputTokens
      - averageDurationMs
      - p95DurationMs
      properties:
        averageDurationMs:
          type: number
          format: double
        failedTraceCount:
          type: integer
          minimum: 0
        inputTokens:
          type: integer
          format: int64
          minimum: 0
        outputTokens:
          type: integer
          format: int64
          minimum: 0
        p95DurationMs:
          type: number
          format: double
        traceCount:
          type: integer
          minimum: 0
    TracePage:
      type: object
      required:
      - agentOptions
      - current
      - size
      - total
      - records
      properties:
        agentOptions:
          type: array
          items:
            $ref: '#/components/schemas/TraceAgentOption'
        current:
          type: integer
          minimum: 0
        records:
          type: array
          items:
            $ref: '#/components/schemas/TraceSummary'
        size:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    TraceSort:
      type: object
      required:
      - field
      - direction
      properties:
        direction:
          $ref: '#/components/schemas/TraceSortDirection'
        field:
          $ref: '#/components/schemas/TraceSortField'
    TraceSortDirection:
      type: string
      enum:
      - Asc
      - Desc
    TraceSortField:
      type: string
      enum:
      - StartedAt
