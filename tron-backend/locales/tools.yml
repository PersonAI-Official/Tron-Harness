agent.toolCatalog.terminal.start.name:
  en: "Start terminal"
  zh-CN: "启动终端"

agent.toolCatalog.terminal.start.description:
  en: "Start an interactive shell or a long-running command in a host-authorized directory. Choose exactly one mode: interactive:true with no command or args starts the host-configured shell; command with interactive omitted or false runs a command. In command mode, omit args for a shell string or supply args for literal argv. Returns a terminal ID for later reads, input and stop."
  zh-CN: "启动交互终端或持续运行的命令，返回可读取输出和发送输入的终端编号。"

agent.toolCatalog.terminal.read.name:
  en: "Read terminal output"
  zh-CN: "读取终端输出"

agent.toolCatalog.terminal.read.description:
  en: "Read retained terminal output with a byte cursor. Sessions are scoped to the host-issued owner."
  zh-CN: "读取当前授权终端的输出，可使用游标继续读取。"

agent.toolCatalog.terminal.write.name:
  en: "Write terminal input"
  zh-CN: "发送终端输入"

agent.toolCatalog.terminal.write.description:
  en: "Write input to an owned terminal."
  zh-CN: "向当前授权终端发送输入。"

agent.toolCatalog.terminal.stop.name:
  en: "Stop terminal"
  zh-CN: "停止终端"

agent.toolCatalog.terminal.stop.description:
  en: "Stop an owned terminal and its managed child processes."
  zh-CN: "停止当前授权终端及其子进程。"

agent.toolCatalog.terminal.list.name:
  en: "List terminals"
  zh-CN: "列出终端"

agent.toolCatalog.terminal.list.description:
  en: "List terminal sessions belonging to the current owner."
  zh-CN: "列出当前身份可访问的终端。"

agent.toolCatalog.tools.bash.exec.name:
  en: "System Command Exec"
  zh-CN: "执行命令"

agent.toolCatalog.tools.bash.exec.description:
  en: "Run a complete command in the authorized directory. Returns taskId and a 16KiB preview per stream, even when completed. stdout/stderr contain content, pageStartCursor, nextCursor, endCursor, hasMore, droppedBytes, captureStatus and captureError. Follow nextCursor with command_exec_read. Complete output requires continuous reads from zero, no dropped bytes, both streams at eof and no more pages. captureToFile=true saves independent session files; check fileCapture status, capturedBytes, maxBytes, fileRef and error. saved plus normal EOF and capturedBytes=endCursor establishes a complete file; empty streams have no fileRef. Commands running after 10 seconds return a task ID. Nonzero exits are command results. Shell quoting, pipes and redirection are supported; args is not accepted. For sudo=true supply the command without sudo and let the host request the password privately; never include passwords in tool arguments or ask_user. This is not a sandbox."
  zh-CN: "在授权目录执行完整命令。即使进程已完成，也只返回 taskId 和每路默认 16KiB 预览。stdout/stderr 包含 content、pageStartCursor、nextCursor、endCursor、hasMore、droppedBytes、captureStatus 和 captureError；用 nextCursor 续读。只有从零连续读取、无丢失、两路正常 EOF 且无后续时才是完整输出。captureToFile=true 独立保存会话文件；检查 fileCapture 的状态、capturedBytes、maxBytes、fileRef 和 error。saved、正常 EOF 且 capturedBytes=endCursor 才是完整文件；空流没有 fileRef。超过 10 秒返回任务 ID。非零退出属于命令结果。支持 Shell 管道、重定向和引号，不接受 args。sudo=true 时提供不含 sudo 的命令，由宿主私密请求密码，禁止通过 ask_user 或工具参数传递密码。这不是沙箱。"

agent.toolCatalog.tools.bash.task_read.name:
  en: "System Command Task Read"
  zh-CN: "读取命令输出"

agent.toolCatalog.tools.bash.task_read.description:
  en: "Read command previews, including after completion. Pass stdout.nextCursor and stderr.nextCursor as stdoutCursor and stderrCursor. hasMore indicates remaining captured bytes; droppedBytes indicates a gap; captureStatus=eof indicates normal stream completion. All pages from zero must have no gap to establish complete output. waitMs can wait briefly for more output. Tasks belong to the originating session."
  zh-CN: "读取命令预览，包括已完成的命令。将 stdout.nextCursor、stderr.nextCursor 分别作为 stdoutCursor、stderrCursor 续读。hasMore 表示还有已采集内容，droppedBytes 表示缺口，captureStatus=eof 表示正常采集结束。只有从零连续读取且所有页无缺口才能认定输出完整。waitMs 可短暂等待。仅允许读取当前会话的任务。"

agent.toolCatalog.tools.bash.task_stop.name:
  en: "System Command Task Stop"
  zh-CN: "停止命令"

agent.toolCatalog.tools.bash.task_stop.description:
  en: "Stop a running command task from this session and return its status and the next stdout/stderr bytes. Pass the cursors returned by the last read to continue from there."
  zh-CN: "停止当前会话中正在运行的命令任务，并返回状态和最新输出。"

agent.toolCatalog.tools.fs.read_text.name:
  en: "File Read Text"
  zh-CN: "读取文件"

agent.toolCatalog.tools.fs.read_text.description:
  en: "Batch-read UTF-8 files or selected ranges. The host records actual returned content for safe editing. Attachments do not grant workspace edit credentials."
  zh-CN: "批量读取授权目录中的文本文件，可指定行范围；宿主记录实际返回内容的版本与读取范围。会话附件不授予工作区编辑凭证。"

agent.toolCatalog.tools.fs.write_text.name:
  en: "File Write Text"
  zh-CN: "写入文件"

agent.toolCatalog.tools.fs.write_text.description:
  en: "Use items to batch independent file creations, complete overwrites or appends. mode is required. Overwrite needs a complete current read; prefer fs_apply_patch for local or related multi-file changes."
  zh-CN: "通过 items 批量创建、完整覆盖或追加文件，必须指定 mode。创建要求目标不存在，覆盖要求完整且未过期的读取基线，追加写入最新内容。局部修改优先使用 fs_apply_patch。"

agent.toolCatalog.tools.fs.apply_patch.name:
  en: "File Patch"
  zh-CN: "编辑文件"

agent.toolCatalog.tools.fs.apply_patch.description:
  en: "Use mode=text for exact targeted replacement or mode=patch for related multi-file add/update/delete/move operations. Read old context first. Unrelated concurrent edits are preserved when exact context still matches. No version fields."
  zh-CN: "mode=text 精确替换已读取的文本；mode=patch 使用 Begin Patch 一次修改多个关联文件。上下文唯一匹配时保留其他代理的无关修改；歧义或真实冲突会拒绝。dryRun 仅预览补丁。无需传版本号。"

agent.toolCatalog.tools.fs.list.name:
  en: "File List"
  zh-CN: "列出文件"

agent.toolCatalog.tools.fs.list.description:
  en: "List files and directories below the configured filesystem root without following symlinks."
  zh-CN: "列出授权目录中的文件和子目录，可按层级浏览。"

agent.toolCatalog.tools.fs.stat.name:
  en: "File Stat"
  zh-CN: "查看文件信息"

agent.toolCatalog.tools.fs.stat.description:
  en: "Read metadata for a filesystem file or directory without following symlinks."
  zh-CN: "查看文件或目录的大小、类型和修改时间。"

agent.toolCatalog.tools.search.grep.name:
  en: "File Search Grep"
  zh-CN: "搜索文件内容"

agent.toolCatalog.tools.search.grep.description:
  en: "Search below the configured root using full glob syntax (**/braces/classes), excludes and .gitignore/.ignore rules. Results use a bounded snapshot: repeat the same query with nextCursor within 120 seconds for stable pages. Inspect complete, skipped and limitReason before treating a scan as exhaustive."
  zh-CN: "按关键词或正则表达式搜索文件内容，可按目录和文件类型筛选。"

agent.toolCatalog.tools.search.glob.name:
  en: "File Search Glob"
  zh-CN: "按规则查找文件"

agent.toolCatalog.tools.search.glob.description:
  en: "Search below the configured root using full glob syntax (**/braces/classes), excludes and .gitignore/.ignore rules. Results use a bounded snapshot: repeat the same query with nextCursor within 120 seconds for stable pages. Inspect complete, skipped and limitReason before treating a scan as exhaustive."
  zh-CN: "按文件名或路径规则查找文件和目录。"

agent.toolCatalog.tools.search.path.name:
  en: "File Search Path"
  zh-CN: "查找文件路径"

agent.toolCatalog.tools.search.path.description:
  en: "Search below the configured root using full glob syntax (**/braces/classes), excludes and .gitignore/.ignore rules. Results use a bounded snapshot: repeat the same query with nextCursor within 120 seconds for stable pages. Inspect complete, skipped and limitReason before treating a scan as exhaustive."
  zh-CN: "根据名称或路径查找文件和目录。"

# Knowledge-base quality evaluation tools.
agent.toolCatalog.quality.sources.name:
  en: "Read evaluation evidence"
  zh-CN: "读取评测原文"

agent.toolCatalog.quality.sources.description:
  en: "Without libraryId, list owned knowledge bases and registered chunk strategies. Otherwise read paged evidence with stable original ranges. Reuse existing extraction; never submit parsing."
  zh-CN: "不填libraryId时列出当前用户知识库与切片策略；填入后分页读取已入库资料的原文及稳定证据范围。仅复用解析产物，不创建解析任务。"

agent.toolCatalog.quality.sources.summary:
  en: "Returns original evidence, source spans and a source fingerprint."
  zh-CN: "返回原文、来源范围和资料指纹。"

agent.toolCatalog.quality.cases.name:
  en: "Manage retrieval evaluation cases"
  zh-CN: "管理检索评测题"

agent.toolCatalog.quality.cases.description:
  en: "Read the dataset when cases is omitted. Save 8–64 cases with sourceFingerprint otherwise, including at least four training and four holdout cases with non-overlapping evidence. Tool-created cases are generated, never human-labeled."
  zh-CN: "不填cases时读取题集；填写sourceFingerprint与cases时保存8至64题，至少4道training与4道holdout，证据范围不能重叠。工具创建的题标记为generated，不得冒充人工标注。"

agent.toolCatalog.quality.cases.summary:
  en: "Returns cases, provenance, source fingerprint and dataset revision."
  zh-CN: "返回题集及其来源指纹、版本和标注来源。"

agent.toolCatalog.quality.start.name:
  en: "Evaluate and optimize a knowledge base"
  zh-CN: "评测并优化知识库"

agent.toolCatalog.quality.start.description:
  en: "Start a bounded background experiment. Generate source-grounded self-test cases if needed, choose candidates on training, and validate only the winner on holdout. Automatically publish confirmed improvements, delete old indexes, and reuse parsed output and tested vectors. Reuse requestId when retrying. Stop at the budget; never create repeated runs to bypass it."
  zh-CN: "启动有预算上限的后台评测与切片优化。没有题集时自动生成原文自测题，训练选优后仅用独立验证题验证获胜方案。确认改善后自动发布并清理旧索引，复用已有解析和已评测向量。相同请求重试沿用requestId。预算耗尽后停止，不要循环创建新任务绕过预算。"

agent.toolCatalog.quality.start.summary:
  en: "Returns a run ID. Read actual scores and publication using rag_quality_status."
  zh-CN: "返回优化任务ID，使用rag_quality_status查询实际指标与发布结果。"

agent.toolCatalog.quality.status.name:
  en: "Read optimization results"
  zh-CN: "查看优化结果"

agent.toolCatalog.quality.status.description:
  en: "List recent library runs, or use runId for baseline, trials, holdout, missing evidence, budget and publication results. waitSeconds is at most 25. Generated-case scores must be described as self-test recall."
  zh-CN: "按libraryId查询最近优化；提供runId读取基线、候选、独立验证、未命中问题、预算与发布结果。waitSeconds最多25秒。自动生成题的指标必须称为自测召回率。"

agent.toolCatalog.quality.status.summary:
  en: "Returns persisted experiment progress and results."
  zh-CN: "返回持久化的优化进度与结果。"

agent.toolCatalog.quality.cancel.name:
  en: "Stop knowledge base optimization"
  zh-CN: "停止知识库优化"

agent.toolCatalog.quality.cancel.description:
  en: "Stop the specified optimization. Keep the current index when the candidate has not been published."
  zh-CN: "停止指定知识库的优化任务，候选未发布时继续使用当前索引。"

agent.toolCatalog.quality.cancel.summary:
  en: "Returns cancellation state."
  zh-CN: "返回取消状态。"

# Knowledge-graph retrieval tools.
agent.toolCatalog.ragGraph.search.name:
  en: "Search knowledge graphs"
  zh-CN: "检索知识图谱"

agent.toolCatalog.ragGraph.search.description:
  en: "Search node fulltext and vectors in the Agent's authorized knowledge bases, memory and skills, then expand incoming and outgoing edges separately, three hops by default. Returns nodes, relationships and original quotes with filenames and locations. Ground claims in references; generated descriptions are not originals. To present cards, call an available A2UI tool yourself using the returned evidence; never invent files, images or locations."
  zh-CN: "在当前智能体获授权的知识库、记忆和技能中，通过节点全文与向量检索选取实体，并分别沿入边、出边默认扩展三层。返回节点、关系及带文件名和位置的原文引文。正文事实必须以references为依据；生成说明不是原文。需要展示卡片时由你调用可用的A2UI工具，引用返回的来源，不得编造图片、文件或位置。"

agent.toolCatalog.ragGraph.search.summary:
  en: "Returns a source-grounded subgraph, hit reasons and a continuation cursor."
  zh-CN: "返回有原文依据的子图、命中原因及可继续加载的游标。"

agent.toolCatalog.ragGraph.expand.name:
  en: "Expand knowledge graphs"
  zh-CN: "展开知识图谱"

agent.toolCatalog.ragGraph.expand.description:
  en: "Expand incoming or outgoing edges from returned nodeIds, optionally filtering relationship types, without another embedding call. For pagination send cursor alone; do not modify options. Each load rechecks authorization and publication. Search again if the cursor expires or snapshot changes. Inspect unfinished and truncatedBy when bounded; never describe a partial graph as complete."
  zh-CN: "从已返回的nodeIds继续读取入边或出边，支持关系类型过滤且不重复调用向量模型。继续分页只传cursor，不能修改查询选项。每次加载重新检查权限及发布快照；游标过期或快照变化须重新检索。达到预算时查看unfinished与truncatedBy，不得把部分子图描述为全图。"

agent.toolCatalog.ragGraph.expand.summary:
  en: "Returns an incremental subgraph, original sources and remaining expansion positions."
  zh-CN: "返回增量子图、原文来源和剩余展开位置。"

agent.toolCatalog.tools.assistant.soul_update.example.name:
  en: "Xiaochuan"
  zh-CN: "小川"

agent.toolCatalog.tools.assistant.soul_update.example.soul:
  en: "Keep answers concise."
  zh-CN: "回答简洁。"

agent.toolCatalog.tools.assistant.work_change.params.operation:
  en: "list: requires taskCode. recordResult: requires taskCode and result. record: requires taskCode, changeKey, kind, summary and evidence; NeedsDecision/Blocked also require requestedAction. resolve: requires changeId, resolution and evidence. Omit fields belonging to other operations."
  zh-CN: "list：需要 taskCode。recordResult：需要 taskCode 和 result。record：需要 taskCode、changeKey、kind、summary 和 evidence；NeedsDecision/Blocked 还需要 requestedAction。resolve：需要 changeId、resolution 和 evidence。不要填写属于其他操作的字段。"

agent.toolCatalog.tools.assistant.soul_update.params.name:
  en: "Confirmed formal name, only when the user authorized naming or renaming."
  zh-CN: "已确认的正式名称，仅在用户明确授权命名或改名时提供。"

agent.toolCatalog.tools.assistant.soul_update.params.initialSoul:
  en: "Nonempty Markdown for first establishment in the onboarding session from user answers or an explicit soul request. Write the entire Markdown, including headings, in the language the user uses during onboarding; honor an explicit language preference first, retain the ongoing language for short answers, and use the interface locale only as fallback. Do not copy the language of system instructions or seed content. Preserve the confirmed name verbatim. Maximum 16384 UTF-8 bytes. Renaming alone does not authorize this. Cannot be combined with edits; unavailable once Ready."
  zh-CN: "引导会话中首次建立灵魂时的非空 Markdown，来源于用户回答或明确的灵魂请求。完整写入 Markdown（含标题），语言与用户在引导过程中使用的一致；用户明确的语言偏好优先，简短回答沿用当前引导语言，界面语言仅作回退。不要照搬系统指令或种子内容的语言。原样保留已确认的名称。最大 16384 UTF-8 字节。仅改名不足以授权此操作。不能与 edits 同时使用；状态为 Ready 后不可用。"

agent.toolCatalog.tools.assistant.soul_update.params.edits:
  en: "Apply in order to the latest soul. Only change requested passages; a missing or ambiguous old passage fails the entire update. Result must fit 16384 UTF-8 bytes."
  zh-CN: "按顺序应用到最新灵魂。只修改用户要求的段落；旧段落缺失或有歧义会导致整次更新失败。结果必须在 16384 UTF-8 字节以内。"

agent.toolCatalog.tools.assistant.soul_update.params.edits.old:
  en: "Exact unique passage to replace; empty string appends new as a new line."
  zh-CN: "要替换的精确且唯一的段落；空字符串表示追加新内容为新行。"

agent.toolCatalog.tools.assistant.soul_update.params.edits.new:
  en: "Replacement text; empty string deletes a nonempty old passage. Must differ from old."
  zh-CN: "替换文本；空字符串会删除非空的旧段落。必须与 old 不同。"

