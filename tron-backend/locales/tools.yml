agent.toolCatalog.tools.assistant.notify.description:
  en: "Publish a platform notification for a persisted changeId from assistant_work_change. PersonAI decides whether, when and how to notify; provide a concrete title and body. Notifications are deduplicated by business change across calls, retries, archive and deletion. Same changeId with different title/body fails with NOTIFICATION_CONTENT_CONFLICT; only identical content can replay. Stored does not prove user receipt. Resolved unpublished items and stale task snapshots cannot be published. Routine execution completion is not a business change."
  zh-CN: "针对 assistant_work_change 返回的 changeId 发布平台通知。是否通知、何时通知、标题和正文由 PersonAI 判断。平台按事项变化跨调用、重试去重，归档或删除后也不重复投递。同一 changeId 的 title/body 不同会报 NOTIFICATION_CONTENT_CONFLICT，仅相同内容可重放；落库不代表用户已收到。已解决且未投递的事项、任务快照已过期的变化不能发布。执行结束本身不构成事项变化。"

agent.toolCatalog.tools.assistant.notify.name:
  en: "Notify the user"
  zh-CN: "通知用户"

agent.toolCatalog.tools.assistant.notify.sampleResultSummary:
  en: "Returns the durable notification receipt, deduplicated by business change."
  zh-CN: "返回按事项变化去重的持久化通知投递记录。"

agent.toolCatalog.tools.assistant.soul_read.description:
