agent.toolCatalog.tools.task.get.description:
  en: "Read an authorized task and its taskFlow.statuses with exact statusCode values. CLOSED means completed; to reopen, task_update with a valid non-CLOSED status and optional progress (defaults to 0 on reopen). Restore an archived task before reopening. No transition graph is enforced beyond flow membership."
