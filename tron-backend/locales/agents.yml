# Agent, assistant, task, skill, memory, model, navigation and account surfaces.
#
# Format: rust-i18n `_version: 2`; one flat dotted key per message with both
# supported locales. Keys prefixed `tron.` are stable display-layer keys that
# match the `message_key` of application/domain error descriptors; the rest are
# keys owned by the inbound HTTP adapters. Never embed user-facing text in Rust
# sources.
_version: 2

