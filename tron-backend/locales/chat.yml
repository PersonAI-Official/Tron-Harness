# Chat HTTP/SSE/Socket.IO user-facing text.
#
# Codes stay stable in the API contract; only this table decides the display
# text. Descriptor keys (`tron.chat.*`, `tron.archives.*`) are the stable
# `message_key` values produced by the application layer and are looked up by
# the HTTP mappers, never by business logic. `error.chat.*` maps the stable
# `CHAT_*`/`AGENT_*`/`VARIABLE_RUNTIME_*` codes used by chat inbound errors.
#
# Format: rust-i18n `_version: 2`, flat dotted keys, both locales required.
_version: 2

# --- HTTP/SSE error codes (stable code strings, localized display text) ---

