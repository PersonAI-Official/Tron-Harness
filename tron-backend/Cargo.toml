[package]
license = "AGPL-3.0-only"
name = "tron-backend"
version = "1.1.0"
edition = "2024"
publish = false

[dependencies]
eliteforge-agent-connector = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-official-plugin-connector-github = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-official-plugin-connector-gitlab = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-official-plugin-connector-gitee = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-capability-chunking = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-capability-auto-routing = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-capability-personai = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-official-plugin-tools-web = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-official-plugin-tools-media = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-official-plugin-tools-discovery = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }

eliteforge-agent-official-plugin-otel = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0", features = ["runtime"] }
eliteforge-agent-official-plugin-otel-collector = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace", "metrics"] }
eliteforge-agent-official-plugin-a2ui = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-official-plugin-skills = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-plugin-core = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-official-plugin-agui = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-memory = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-official-plugin-model-http = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-official-plugin-tools-human = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-capability-external = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"
chrono-tz = "0.10"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }
async-trait = "0.1"
tokio-util = "0.7"
futures-util = "0.3"
eliteforge-agent-official-plugin-tools-mcp = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-capability-tools = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-official-plugin-tools-agents = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
tron-harness-capability = { path = "crates/tron-harness-capability" }
tron-i18n = { path = "crates/i18n" }
tron-remote-pack = { path = "crates/tron-remote-pack" }
eliteforge-agent-remote-protocol = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-remote-rpc = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-remote-server = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-capability-remote-access = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-capability-development = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-core = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-framework = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0", default-features = false }
eliteforge-agent-capability-runtime = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-official-plugin-tools-local = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0" }
eliteforge-agent-official-plugin-storage-local = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", tag = "1.0.0", features = ["bundled-native"] }
aes-gcm-siv = "0.11"
axum = { version = "0.8", features = ["multipart"] }
async-stream = "0.3"
base64 = "0.22"
bcrypt = "0.17"
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crab-serverapi = { git = "https://gitee.com/person-ai/person-ai-index-rust-sdk.git", rev = "d29d8ad" }
cron = "0.12"
gmcrypto-core = { version = "1.0.0", features = ["sm4-aead"] }
grafeo = { version = "0.5.42", default-features = false, features = ["embedded", "storage"] }
hex = "0.4"
hmac = "0.12"
jsonwebtoken = "9"
jsonschema = { version = "0.47", default-features = false }
opendal = { version = "=0.57.0", default-features = false, features = ["blocking", "executors-tokio", "reqwest-rustls-tls", "services-s3"] }
ldap3 = "0.12.1"
rand = "0.9.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rskafka = { version = "0.6", default-features = false, features = ["transport-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
redis = { version = "0.32.7", default-features = false, features = ["cluster-async", "tokio-rustls-comp"] }
rusqlite = { version = "0.37", features = ["bundled", "load_extension", "functions"] }
fs2 = "0.4"
tokio-rusqlite = { version = "0.7.0", features = ["bundled"] }
russh = { version = "0.62.6", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_path_to_error = "0.1"
serde_json = "1"
rfd = "0.17.2"
semver = "1"
serde_yaml = "0.9"
sha2 = "0.10"
shell-words = "1"
snowflaked = { version = "1.0.3", features = ["sync"] }
socketioxide = { version = "0.18.6", features = ["state"] }
sqlx = { version = "0.8.6", default-features = false, features = ["mysql", "postgres", "runtime-tokio-rustls"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-cron = "0.1.3"
tower-http = { version = "0.6", features = ["cors"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "yaml"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }
unicode-normalization = "0.1"
url = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
regex = "1"
scraper = "0.24"
umya-spreadsheet = "3.1"
pdf-extract = "0.12"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[profile.release]
# Reduce the distributed sidecar size while retaining panic unwinding for
# document extraction and agent execution that recover with catch_unwind.
opt-level = "s"
codegen-units = 1
strip = "symbols"
lto = "thin"
