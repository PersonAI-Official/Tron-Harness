[package]
license = "AGPL-3.0-only"
name = "tron-harness-capability"
version = "0.1.0"
edition = "2024"
publish = false

# Keep the harness contract independently testable while the application runtime
# and its database adapter are migrated. This is a native, in-process package.
[workspace]

[dependencies]
async-trait = "0.1"
eliteforge-agent-core = { git = "https://github.com/Penglai-Link/eliteforge-agent-framework.git", rev = "b72f6fe3d631b65fe80bbc0963f8c8cd8f4923d2" }
eliteforge-agent-official-plugin-tools-local = { git = "https://github.com/Penglai-Link/eliteforge-agent-framework.git", rev = "b72f6fe3d631b65fe80bbc0963f8c8cd8f4923d2" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tron-i18n = { path = "../i18n" }

[build-dependencies]
eliteforge-agent-core = { git = "https://github.com/Penglai-Link/eliteforge-agent-framework.git", rev = "b72f6fe3d631b65fe80bbc0963f8c8cd8f4923d2" }
