[package]
name = "tron-remote-pack"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
eliteforge-agent-remote-protocol = { git = "https://github.com/Penglai-Link/eliteforge-agent-framework.git", tag = "1.0.1" }
eliteforge-agent-remote-rpc = { git = "https://github.com/Penglai-Link/eliteforge-agent-framework.git", tag = "1.0.1" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
base64 = "0.22"
futures-util = "0.3"
